name: docker-publish

on:
  workflow_dispatch:

jobs:
  publish-dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get artifacts
        run: |
          bash get_artifacts.sh ${{ secrets.GITHUB_TOKEN }} "v4.15.19"
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 下载Linux QQ，官网链接 https://im.qq.com/index/#/linux
      - name: Download LinuxQQ deb
        run: |
          curl -L -o linuxqq.deb "${{ secrets.QQ_DEB_URL }}"
          ls -lh linuxqq.deb

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: 'linux/amd64'
          push: true
          tags: ghcr.io/${{ github.actor }}/napcat:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        
